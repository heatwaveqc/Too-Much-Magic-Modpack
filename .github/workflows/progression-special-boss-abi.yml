name: Progression special boss pinned ABI (static only)
on:
  push:
    branches:
      - 'feature/progression-channel-integration-*'
    paths:
      - 'compat/progression/tools/boss_encounter_abi.py'
      - '.github/workflows/progression-special-boss-abi.yml'
  pull_request:
    paths:
      - 'compat/progression/**'
      - '.github/workflows/progression-special-boss-abi.yml'
permissions:
  contents: read
jobs:
  pinned:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python compat/progression/tools/boss_encounter_abi.py
