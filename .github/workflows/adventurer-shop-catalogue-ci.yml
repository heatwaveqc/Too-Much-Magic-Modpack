name: Adventurers Shop catalogue source checks
on:
  pull_request:
    paths:
      - 'scripts/generate_adventurer_shop.py'
      - 'scripts/test_generate_adventurer_shop.py'
      - 'manifest/adventurer-shop-policy.json'
      - 'compat/economy/src/main/resources/data/tmm/tags/item/shop/**'
      - 'config/qshop/shops/tmm.json'
      - '.github/workflows/adventurer-shop-catalogue-ci.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  catalogue:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m unittest discover -s scripts -p 'test_generate_adventurer_shop.py' -v
