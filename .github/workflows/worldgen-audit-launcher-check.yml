name: Worldgen launcher offline authorization fixtures
on:
  pull_request:
    paths:
      - 'scripts/worldgen_audit_dispatch.py'
      - 'scripts/worldgen_dispatch_diagnostics.py'
      - 'scripts/run_worldgen_vanilla_control.py'
      - 'tests/test_worldgen_audit_dispatch.py'
      - '.github/workflows/worldgen-audit-dispatch.yml'
      - '.github/workflows/worldgen-audit-pilot.yml'
      - '.github/workflows/worldgen-audit-launcher-check.yml'
permissions:
  contents: read
  actions: read
jobs:
  fixtures:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -p test_worldgen_audit_dispatch.py -v
      - name: Read-only registered workflow diagnostics
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PYTHONPATH=scripts python - <<'PY'
          import json, os
          from worldgen_dispatch_diagnostics import registration, DiagnosticAPI
          print("WORKFLOW_REGISTRATION "+json.dumps(registration(DiagnosticAPI(os.environ["GH_TOKEN"])),sort_keys=True))
          PY
      - name: Validate actual Actions workflow syntax
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.7
          "$(go env GOPATH)/bin/actionlint" -color=false -shellcheck= -pyflakes= .github/workflows/worldgen-audit-pilot.yml .github/workflows/worldgen-audit-dispatch.yml
      - name: Validate launcher has only manual boot trigger
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/worldgen-audit-pilot.yml').read_text()
          block=p.split('\non:\n',1)[1].split('\npermissions:',1)[0]
          assert block.startswith('  workflow_dispatch:')
          assert 'pull_request:' not in block and 'push:' not in block and 'schedule:' not in block and 'issue_comment:' not in block
          assert 'default: false' in block
          assert "github.event_name == 'workflow_dispatch' && inputs.authorized_build == true" in p
          assert "github.run_attempt == 1" in p
          print('Manual-only explicit-opt-in pilot gate present; no Minecraft execution.')
          PY
