name: Cave exact publisher pins (NO GAME BOOT)
on:
  pull_request:
    branches: [test/full-integration]
    paths:
      - 'scripts/resolve_cave_pins.py'
      - '.github/workflows/resolve-cave-pins.yml'
permissions:
  contents: read
jobs:
  metadata:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify four publisher files and exact Tectonic worldgen overlap
        run: python scripts/resolve_cave_pins.py "$RUNNER_TEMP/cave-pins"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cave-pin-proposals
          path: ${{ runner.temp }}/cave-pins
          if-no-files-found: error
