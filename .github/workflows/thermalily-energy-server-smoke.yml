name: Thermalily and ProjectE converters combined server smoke
on:
  push:
    paths:
      - 'compat/transformations/**'
      - 'mods/projecte-energy-converters.pw.toml'
      - 'manifest/mods.json'
      - 'index.toml'
      - 'pack.toml'
      - '.github/workflows/thermalily-energy-server-smoke.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  combined-server:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'
      - name: Compile and test first-party compatibility bridge
        working-directory: compat/transformations
        run: gradle --no-daemon build
      - name: Verify complete pack metadata
        run: python3 scripts/validate.py
      - name: Boot pinned full pack with Thermalily fix and converters
        env:
          SMOKE_WITH_MODS: '1'
          SMOKE_TIMEOUT_SECONDS: '720'
          WORK_DIR: ${{ runner.temp }}/tmm-energy-test
          SMOKE_EXTRA_MOD_JAR: ${{ github.workspace }}/compat/transformations/build/libs/tmm_transformations-0.1.0-dev.jar
        run: bash scripts/smoke_server.sh
      - name: Show key findings on failure
        if: failure()
        run: |
          for path in "${{ runner.temp }}/tmm-energy-test/logs/latest.log" "${{ runner.temp }}/tmm-energy-test/logs/kubejs/startup.log"; do
            if [ -f "$path" ]; then
              echo "===== $path ====="
              grep -Ei 'error|fatal|mixin|thermalily|projecte.energy|projecte_energy|converter|failed|done \\(' "$path" | tail -n 90 || true
            fi
          done
      - name: Upload diagnostics (no proprietary mod JARs or world saves)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: thermalily-energy-server-logs
          path: |
            ${{ runner.temp }}/tmm-energy-test/server.log
            ${{ runner.temp }}/tmm-energy-test/logs/latest.log
            ${{ runner.temp }}/tmm-energy-test/logs/kubejs/startup.log
          if-no-files-found: warn
          retention-days: 14
