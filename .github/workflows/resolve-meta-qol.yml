name: Resolve and smoke full meta/QoL batch
on:
  workflow_dispatch:
    inputs:
      full_smoke:
        description: 'Explicit owner authorization for manual build or server smoke'
        type: boolean
        required: true
        default: false
permissions:
  contents: write

jobs:
  resolve-boot-commit:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.full_smoke == true }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-go@v5
        with:
          go-version: 'stable'
      - name: Validate resolver Python syntax
        run: python3 -m py_compile scripts/resolve_meta_qol.py scripts/download_mods.py scripts/validate.py
      - name: Compile packwiz and resolve the entire requested stack
        run: |
          go install github.com/packwiz/packwiz@v0.0.0-20261014010756-170b22d78595
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          export PATH="$(go env GOPATH)/bin:$PATH"
          python3 scripts/resolve_meta_qol.py
          packwiz list
      - name: Test modded dedicated server from hash-pinned files
        id: smoke
        continue-on-error: true
        env:
          SMOKE_WITH_MODS: '1'
          SMOKE_TIMEOUT_SECONDS: '240'
          WORK_DIR: ${{ runner.temp }}/tmm-b2-smoke
        run: bash scripts/smoke_server.sh
      - name: Commit exact resolved pins and test status to working branch
        if: always()
        env:
          TEST_OUTCOME: ${{ steps.smoke.outcome }}
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          a=json.loads(Path('docs/META-QOL-RESOLUTION.json').read_text())
          ok=os.environ['TEST_OUTCOME']=='success'
          lines=[
            '# Meta / QoL integration smoke',
            '',
            'NeoForge 21.1.265, Minecraft 1.21.1, Java 21 (GitHub Actions Linux).',
            f'**Dedicated modded-server smoke: {"PASS" if ok else "FAIL / NOT EXECUTED"}**.',
            'Test used a disposable world and verified all server JAR hashes.',
            f'{len(a["resolved_mods"])} mod artifacts pinned, {len(a["failed_modrinth_resolutions"])} requested slugs unresolved.',
            '',
            '**Graphical client: NOT TESTED**. Modded game logic and recipes: not tested.',
            'CI workflow logs and artifacts are evidence for this run.',
            '',
            '## Unresolved requested slugs',
          ]
          for item in a['failed_modrinth_resolutions']:
            lines.append(f'- `{item["slug"]}`: Modrinth selection failed; exact diagnostic in META-QOL-RESOLUTION.json')
          if not a['failed_modrinth_resolutions']: lines.append('- None from automated Modrinth resolution.')
          Path('docs/META-QOL-TESTING.md').write_text('\n'.join(lines)+'\n')
          p=Path('manifest/mods.json')
          m=json.loads(p.read_text())
          batch=next(x for x in m['batches'] if x['id']=='B1')
          batch['status']='meta_qol_server_smoked_client_pending' if ok else 'meta_qol_server_failed_investigate'
          p.write_text(json.dumps(m,indent=2)+'\n')
          PY
          python3 scripts/validate.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pack.toml index.toml mods manifest/mods.json docs/META-QOL-RESOLUTION.json docs/META-QOL-TESTING.md
          if ! git diff --cached --quiet; then
            git commit -m "build(meta-qol): pin resolved mods and record server smoke status"
            git push origin "HEAD:build/b2-meta-qol"
          fi
      - name: Upload full smoke logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tmm-b2-meta-qol-server
          path: |
            ${{ runner.temp }}/tmm-b2-smoke/server.log
            ${{ runner.temp }}/tmm-b2-smoke/logs/latest.log
            docs/META-QOL-RESOLUTION.json
            docs/META-QOL-TESTING.md
          if-no-files-found: warn
      - name: Fail workflow if modded server boot failed
        if: steps.smoke.outcome != 'success'
        run: exit 1
