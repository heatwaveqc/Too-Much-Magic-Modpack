name: B5 repair Lodestone and addons, rerun full boot
on:
  push:
    branches: [build/b5-expanded-approved-roster]
    paths: ['.github/workflows/b5-dependency-repair.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: Build packwiz and repair exact upstream libraries/addons
        id: repair
        continue-on-error: true
        run: |
          python3 -m py_compile scripts/repair_b5.py scripts/validate.py
          go install github.com/packwiz/packwiz@v0.0.0-20261014010756-170b22d78595
          export PATH="$(go env GOPATH)/bin:$PATH"
          python3 scripts/repair_b5.py
          packwiz list
      - name: Full expanded dedicated server startup
        id: smoke
        if: steps.repair.outcome == 'success'
        continue-on-error: true
        env:
          SMOKE_WITH_MODS: '1'
          SMOKE_TIMEOUT_SECONDS: '480'
          WORK_DIR: ${{ runner.temp }}/tmm-b5-repaired
        run: bash scripts/smoke_server.sh
      - name: Persist all results in repository
        if: steps.repair.outcome == 'success'
        env:
          SMOKE_RESULT: ${{ steps.smoke.outcome }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          passed=os.environ['SMOKE_RESULT']=='success'
          evidence=json.loads(Path('docs/B5-RESOLUTION.json').read_text())
          mods=evidence['added_mods']
          unresolved=evidence['unresolved']
          lines=["# B5 full expanded approved roster: repaired integration",
                 "",
                 f"**Dedicated server result: {'PASS' if passed else 'FAIL'}.**",
                 "",
                 "- Full repaired run: "+os.environ['RUN_URL'],
                 "- First combined run: https://github.com/heatwaveqc/Too-Much-Magic-Modpack/actions/runs/43552770652 (failed for missing Lodestone).",
                 "- Minecraft 1.21.1 / NeoForge 21.1.265 / Java 21.",
                 f"- Total mod pins: {evidence['total_pins']} (baseline 71).",
                 f"- Newly added projects and libraries: {len(mods)}.",
                 "- Added Lodestone 1.8.2, Ars Elemental, and Gaze (A Malum Addon).",
                 "- Hard exclusions preserved; 4 maturity-review-only systems not installed.",
                 "- Client GUI, actual fresh world, mod feature behavior and ProjectE Chaos Guardian gates: NOT TESTED.",
                 "",
                 "## Added mod identities",
                 ""]
          lines.extend("- `"+s+"`" for s in mods)
          lines.extend(["","## Unresolved approvals",""])
          if not unresolved:lines.append("- None in the documented 31 new approvals.")
          else:lines.extend("- "+x['id']+": "+x.get('reason','unknown') for x in unresolved)
          if not passed:
              lines.extend(["","## Boot failure","",
                      "Dedicated server did not reach the clean Done readiness condition. See CI artifacts for exact error."])
          Path('docs/B5-TESTING.md').write_text('\n'.join(lines)+'\n')
          mp=Path('manifest/mods.json');m=json.loads(mp.read_text())
          next(x for x in m['batches'] if x['id']=='B7')['status']=(
             'server_smoked_client_pending' if passed else 'server_failed_after_lodestone_repair')
          mp.write_text(json.dumps(m,indent=2)+'\n')
          PY
          python3 scripts/validate.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pack.toml index.toml mods manifest/mods.json docs/B5-RESOLUTION.json docs/B5-TESTING.md
          if ! git diff --cached --quiet; then
            git commit -m "test(b5): pin Malum prerequisite and remaining addons, record full boot"
            git push origin HEAD:build/b5-expanded-approved-roster
          fi
      - name: Upload server logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tmm-b5-repaired-smoke
          path: |
            docs/B5-RESOLUTION.json
            docs/B5-TESTING.md
            ${{ runner.temp }}/tmm-b5-repaired/server.log
            ${{ runner.temp }}/tmm-b5-repaired/logs/latest.log
            ${{ runner.temp }}/tmm-b5-repaired/crash-reports
          if-no-files-found: warn
      - name: Mark any unresolved boot as failed
        if: steps.repair.outcome != 'success' || steps.smoke.outcome != 'success'
        run: exit 1
