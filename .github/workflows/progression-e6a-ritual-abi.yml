name: Progression E6a pinned ritual ABI (static only)
on:
  pull_request:
    paths:
      - 'compat/progression/tools/e6a_ritual_abi.py'
      - '.github/workflows/progression-e6a-ritual-abi.yml'
permissions:
  contents: read
jobs:
  abi:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Verify exact JARs and inspect recipe and ritual completion paths
        run: python3 compat/progression/tools/e6a_ritual_abi.py
