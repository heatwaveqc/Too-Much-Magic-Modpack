name: Trader's Vengence - Quick Compile (No Smoke)
on:
  push:
    branches:
      - 'feature/traders-vengence'
    paths:
      - 'compat/traders-vengence/**'
      - '.github/workflows/traders-vengence-quick.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile-unit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'
      - name: Compile and unit test the isolated module (NO SERVER BOOT)
        working-directory: compat/traders-vengence
        run: gradle --no-daemon clean test build
