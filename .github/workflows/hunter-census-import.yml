name: Hunter - Preserve verified entity census in research PR
on:
  push:
    branches: ['research/hunter-pinned-jar-audit-ci']
    paths: ['.github/workflows/hunter-census-import.yml']
permissions:
  contents: write
  actions: read
jobs:
  archive-census:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Hunter inventory PR branch
        uses: actions/checkout@v4
        with:
          ref: research/hunter-creature-inventory-2026-11-15
          fetch-depth: 0
          persist-credentials: true
      - name: Download successful full-server evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download 43755119592 --repo heatwaveqc/Too-Much-Magic-Modpack -n hunter-pinned-jar-audit -D "$RUNNER_TEMP/hunter-evidence"
      - name: Generate pinned runtime CSV from actual server census
        env:
          LOG: ${{ runner.temp }}/hunter-evidence/runtime-census.log
        run: |
          python3 - <<'PY'
          import csv, os, re, pathlib
          p=pathlib.Path(os.environ['LOG'])
          assert p.exists(),f"Missing census: {p}"
          source=p.read_text().splitlines()
          rx=re.compile(r'HUNTER_RUNTIME_ENTITY id=([^ ]+) category=([^ ]+) tags=(.*)$')
          rows=[]
          for s in source:
              m=rx.search(s)
              if m:
                  id,cat,tags=m.groups()
                  rows.append([id,id.split(':',1)[0],cat,tags,'unverified','no','needs-policy-audit'])
          rows=sorted(rows)
          assert len(rows)==1393, f"Unexpected census count: {len(rows)}"
          assert len({r[0] for r in rows})==len(rows)
          output=pathlib.Path('docs/hunter/runtime-entity-census.csv')
          output.parent.mkdir(parents=True,exist_ok=True)
          with output.open('w',newline='') as fh:
              w=csv.writer(fh)
              w.writerow(['registered_id','namespace','mob_category','runtime_entity_tags','living_verified','hunt_eligible','taxonomy_status'])
              w.writerows(rows)
          print(f"PASS: wrote {len(rows)} runtime IDs; conservative eligibility unknown")
          PY
      - name: Commit evidence only, without game code or JARs
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/hunter/runtime-entity-census.csv
          git commit -m 'research(hunter): preserve 1393-ID exact-pack runtime census'
          git push origin HEAD:research/hunter-creature-inventory-2026-11-15
