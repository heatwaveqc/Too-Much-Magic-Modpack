name: Verify bootstrap
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  metadata:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify manifest, packwiz hash chain and exclusions
        run: python3 scripts/validate.py
      - name: Verify material-unification candidate safety checks
        run: python3 scripts/verify_materials.py
      - name: Check KubeJS material and Mahou bridge script syntax
        run: |
          node --check kubejs/server_scripts/material_unification.js
          node --check kubejs/server_scripts/mahou_neo_vitae_circle_bridge.js
          node --check kubejs/server_scripts/mahou_neo_vitae_catalyst_exchange.js
          node scripts/test_mahou_catalyst_exchange.cjs
      - name: Validate five-group FTB Quests navigation
        run: python3 scripts/validate_quests.py
      - uses: actions/setup-go@v5
        with:
          go-version: 'stable'
      - name: Build packwiz CLI and read pack
        run: |
          go install github.com/packwiz/packwiz@v0.0.0-20261014010756-170b22d78595
          "$(go env GOPATH)/bin/packwiz" list

      - name: Resolve first Modrinth infrastructure pins (no repository writes)
        if: github.ref_name == 'build/initial-neoforge-packwiz'
        run: |
          PACKWIZ="$(go env GOPATH)/bin/packwiz"
          "$PACKWIZ" --yes modrinth add kubejs
          "$PACKWIZ" --yes modrinth add modernfix
          "$PACKWIZ" refresh
          "$PACKWIZ" list
          python3 - <<'PY'
          import json
          from pathlib import Path
          for p in [Path("pack.toml"), Path("index.toml"), *sorted(Path("mods").glob("*.pw.toml"))]:
              print("TMM_SNAPSHOT " + json.dumps({"path":str(p),"content":p.read_text(encoding="utf-8")}, ensure_ascii=False))
          PY

  loader-server:
    if: github.ref_name == 'build/initial-neoforge-packwiz'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install and launch clean NeoForge loader (NO mods)
        env:
          SMOKE_TIMEOUT_SECONDS: '180'
          WORK_DIR: ${{ runner.temp }}/tmm-loader-smoke
        run: bash scripts/smoke_server.sh
      - name: Retain loader evidence on success and failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: neoforge-loader-smoke-log
          path: ${{ runner.temp }}/tmm-loader-smoke/server.log
          if-no-files-found: warn

  modded-server:
    if: github.ref_name == 'build/b1-kubejs-infrastructure' || github.ref_name == 'build/b2-meta-qol' || github.ref_name == 'build/b3-stable-magic-tectonic' || github.ref_name == 'build/b4-reactors-experimental' || github.ref_name == 'build/b5-expanded-approved-roster' || github.ref_name == 'build/b6-food-pufferfish-skills-client-handoff' || github.ref_name == 'build/b7-inventory-refoxed-qol-audit' || github.ref_name == 'build/b8-qol-compass-farming-market' || github.ref_name == 'design/five-category-quest-chapter-inventory' || github.ref_name == 'feature/ftb-quests-45-chapter-scaffold' || github.ref_name == 'feature/ftb-quests-intro-food-tips' || github.ref_name == 'feature/materials-unification-mahou-doubling' || github.ref_name == 'feature/neo-vitae-canonical-dusts' || github.ref_name == 'feature/mahou-catalyst-exchange-kubejs'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install and launch hash-pinned mods on dedicated NeoForge server
        env:
          SMOKE_WITH_MODS: '1'
          SMOKE_TIMEOUT_SECONDS: '480'
          WORK_DIR: ${{ runner.temp }}/tmm-modded-smoke
          SMOKE_AU_DEBUG: ${{ github.ref_name == 'feature/materials-unification-mahou-doubling' && '1' || '0' }}
        run: bash scripts/smoke_server.sh
      - name: Assert actual material tags and magical exclusions
        if: github.ref_name == 'feature/materials-unification-mahou-doubling'
        run: python3 scripts/check_runtime_material_tags.py "${{ runner.temp }}/tmm-modded-smoke/logs/almostunified/debug/tags.txt"
      - name: Inspect generated Neo Vitae materials and unified tags
        if: always() && github.ref_name == 'feature/materials-unification-mahou-doubling'
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          base = Path("${{ runner.temp }}/tmm-modded-smoke")
          path = base / "config/neovitae/materials.json"
          print("=== LIVE NEO VITAE MATERIALS ===")
          if path.exists():
              try:
                  data = json.loads(path.read_text())
                  entries = data if isinstance(data, list) else data.get("materials", [])
                  print(f"Entries: {len(entries)} (JSON type={type(data).__name__})")
                  for entry in entries:
                      if not isinstance(entry, dict): continue
                      print(json.dumps({k:entry.get(k) for k in ("name", "generative", "gen_ore", "gen_raw", "ore_tag", "raw_tag", "smelt_to")}))
              except Exception as exc:
                  print("Could not parse materials file:", type(exc).__name__, str(exc))
          else:
              print("No generated config found after first server startup; may require an additional world load or restart.")
          print("=== ALMOST UNIFIED TAGS (silver/lead/iron/gold/copper/sulfur) ===")
          tags = base / "logs/almostunified/debug/tags.txt"
          if tags.exists():
              lines = tags.read_text(errors="replace").splitlines()
              matched = [(i, s) for i,s in enumerate(lines) if any(w in s.lower() for w in ("silver", "lead", "iron", "gold", "copper", "sulfur"))]
              for i,s in matched[:120]:
                  print(f"{i+1}: {s[:300]}")
              print(f"Total matching lines: {len(matched)}")
          else:
              print("No tags.txt dump found; inspect Almost Unified logs.")
          PY
      - name: Retain modded-server logs on success and failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tmm-modded-server-logs
          path: |
            ${{ runner.temp }}/tmm-modded-smoke/server.log
            ${{ runner.temp }}/tmm-modded-smoke/logs/latest.log
            ${{ runner.temp }}/tmm-modded-smoke/config/neovitae/materials.json
            ${{ runner.temp }}/tmm-modded-smoke/logs/almostunified/debug/tags.txt
          if-no-files-found: warn
