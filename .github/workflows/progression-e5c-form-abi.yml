name: Progression E5c pinned form ABI (static only)
on:
  pull_request:
    paths:
      - 'compat/progression/tools/e5c_form_abi.py'
      - '.github/workflows/progression-e5c-form-abi.yml'
permissions:
  contents: read
jobs:
  abi:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Verify pinned release and inspect native form attack and mining seams
        run: python3 compat/progression/tools/e5c_form_abi.py
