name: Progression E4 pinned payment ABI (static only)
on:
  pull_request:
    paths:
      - '.github/workflows/progression-e4-payment-abi.yml'
      - 'compat/progression/tools/e4_payment_abi_ci.py'
permissions:
  contents: read
jobs:
  abi:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Inspect exact pinned payment signatures, no game launch
        run: python3 compat/progression/tools/e4_payment_abi_ci.py
