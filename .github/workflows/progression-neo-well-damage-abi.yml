name: Progression Neo Well damage ABI (static only)
on:
  pull_request:
    paths:
      - '.github/workflows/progression-neo-well-damage-abi.yml'
      - 'compat/progression/tools/neo_well_damage_abi.py'
      - 'compat/progression/src/main/java/**/NeoWellDamageMixin.java'
      - 'compat/progression/src/main/java/**/OwnedMagicDamage.java'
permissions:
  contents: read
jobs:
  abi:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: python3 compat/progression/tools/neo_well_damage_abi.py
