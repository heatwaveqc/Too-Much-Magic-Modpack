name: Resolve approved adventure mob darkness pins (metadata only)
on:
  push:
    branches: [integration/approved-adventure-mobs-darkness-pins-20261116]
    paths:
      - 'scripts/resolve_adventure_mob_targets.py'
      - 'manifest/next-adventure-mob-targets.json'
  pull_request:
    paths:
      - 'scripts/resolve_adventure_mob_targets.py'
      - 'manifest/next-adventure-mob-targets.json'
permissions:
  contents: read
jobs:
  metadata:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Resolve official exact runtime candidates and required dependency edges
        run: python3 scripts/resolve_adventure_mob_targets.py --output "$RUNNER_TEMP/approved-pins"
      - uses: actions/upload-artifact@v4
        with:
          name: approved-adventure-mob-pin-proposal
          path: ${{ runner.temp }}/approved-pins
          if-no-files-found: error
