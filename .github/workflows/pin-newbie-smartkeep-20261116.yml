name: B21 one-shot Smart Keep source pin (no game build)
on:
  push:
    branches: ['integration/newbie-mode-smartkeep-20261116']
    paths:
      - 'scripts/pin_newbie_smartkeep_metadata.py'
      - '.github/workflows/pin-newbie-smartkeep-20261116.yml'
  pull_request:
    branches: ['test/full-integration']
    paths:
      - 'scripts/pin_newbie_smartkeep_metadata.py'
      - '.github/workflows/pin-newbie-smartkeep-20261116.yml'
permissions:
  contents: write
concurrency:
  group: newbie-smartkeep-pin
  cancel-in-progress: false
jobs:
  pin-exact:
    if: github.repository == 'heatwaveqc/Too-Much-Magic-Modpack'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: integration/newbie-mode-smartkeep-20261116
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Resolve exact approved provider version and SHA512, then update Packwiz
        run: python3 scripts/pin_newbie_smartkeep_metadata.py
      - name: Static source verification (no server boot or JAR downloads)
        run: python3 scripts/validate.py
      - name: Commit exact metadata to this isolated integration branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- mods/smart-keep-inventory.pw.toml index.toml pack.toml manifest/mods.json
          git diff --cached --check
          if ! git diff --cached --quiet; then
            git commit -m "B21: pin official Smart Keep Inventory 1.21.1 NeoForge SHA512"
            git push origin HEAD:integration/newbie-mode-smartkeep-20261116
          fi
