name: Economy texture pin survey (read-only)
on:
  push:
    branches: ['feature/economy-apotheosis-gem-emc']
    paths: ['compat/economy/tools/audit-textures.py', '.github/workflows/economy-texture-audit.yml']
permissions:
  contents: read
jobs:
  survey:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install Pillow
      - run: python compat/economy/tools/audit-textures.py "$RUNNER_TEMP/texture-pins"
