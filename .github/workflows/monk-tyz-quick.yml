name: Monk Tyz full-tree quick validation
on:
  push:
    branches:
      - 'feature/monk-tyz-*'
    paths:
      - 'compat/magic/**'
      - 'compat/progression/**'
      - 'scripts/activate_tyzs.py'
      - 'scripts/verify_tyz_migration.py'
      - 'manifest/integration-sources.json'
      - 'tests/test_monk_tyz_tree.py'
      - '.github/workflows/monk-tyz-quick.yml'
  pull_request:
    paths:
      - 'compat/magic/**'
      - 'compat/progression/**'
      - 'scripts/activate_tyzs.py'
      - 'scripts/verify_tyz_migration.py'
      - 'manifest/integration-sources.json'
      - 'tests/test_monk_tyz_tree.py'
      - '.github/workflows/monk-tyz-quick.yml'
permissions:
  contents: read
jobs:
  source-and-compile:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'
      - name: Validate staged Tyz overlay and all 18 Monk skill contracts
        run: |
          python3 compat/magic/stage_preview.py --check
          python3 -m unittest discover -s tests -p 'test_monk_tyz_tree.py'
          python3 -m py_compile scripts/activate_tyzs.py scripts/verify_tyz_migration.py scripts/stage_monk_tyz.py
      - name: Compile and unit test the native Monk/Hunter Tyz bridge
        working-directory: compat/progression
        run: gradle --no-daemon build
      - name: State explicitly that no full modded smoke ran
        run: |
          echo "Quick source/schema/Java compile checks ONLY." >> "$GITHUB_STEP_SUMMARY"
          echo "No client GUI test, no full NeoForge smoke, no Prism artifact." >> "$GITHUB_STEP_SUMMARY"
