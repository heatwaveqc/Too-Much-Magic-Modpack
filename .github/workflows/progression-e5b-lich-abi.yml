name: Progression E5b pinned lich ABI (static only)
on:
  pull_request:
    paths:
      - 'compat/progression/tools/e5b_lich_abi.py'
      - '.github/workflows/progression-e5b-lich-abi.yml'
permissions:
  contents: read
jobs:
  abi:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Verify pin and inspect native lich call sites
        run: python3 compat/progression/tools/e5b_lich_abi.py
