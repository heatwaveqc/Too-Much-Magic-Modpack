name: Approved food JAR audit (source only, NO GAME BOOT)

on:
  push:
    branches:
      - feature/food-provenance-census-444-20261122
  pull_request:
    paths:
      - 'scripts/audit_approved_food_jars.py'
      - 'scripts/food_provenance_census.py'
      - 'tests/test_food_publisher_census.py'
      - '.github/workflows/audit-approved-food-jars.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pinned-and-approved-source:
    name: Publisher JAR recipes and metadata (NO game)
    runs-on: ubuntu-latest
    timeout-minutes: 43
    strategy:
      fail-fast: false
      matrix:
        scope: [candidates, pinned]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify synthetic recipe/tag/loot metadata, no remote I/O
        run: python3 -m unittest discover -s tests -p 'test_food_publisher_census.py' -v
      - name: Download only exact selected or pinned publisher JARs into memory, audit metadata and source resources
        run: |
          python3 scripts/audit_approved_food_jars.py --scope '${{ matrix.scope }}' \
            --json-out '/tmp/food-jar-audit-${{ matrix.scope }}.json'
      - name: Publish JSON source evidence only (never JAR binaries)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: approved-food-jar-audit-${{ matrix.scope }}
          path: /tmp/food-jar-audit-${{ matrix.scope }}.json
          if-no-files-found: warn
