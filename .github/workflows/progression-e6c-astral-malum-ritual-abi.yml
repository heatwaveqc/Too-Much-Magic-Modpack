name: Progression E6c Astral and Malum pinned ritual ABI (static only)
on:
  pull_request:
    paths:
      - 'compat/progression/tools/e6c_astral_malum_ritual_abi.py'
      - 'compat/progression/src/main/java/io/github/heatwaveqc/tyr/progression/mxp/**'
      - '.github/workflows/progression-e6c-astral-malum-ritual-abi.yml'
permissions:
  contents: read
jobs:
  abi:
    strategy:
      fail-fast: false
      matrix:
        provider: [astral, malum, gaze]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: python3 compat/progression/tools/e6c_astral_malum_ritual_abi.py ${{ matrix.provider }}
