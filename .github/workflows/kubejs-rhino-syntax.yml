name: KubeJS pinned Rhino checks (NO GAME BOOT)

on:
  pull_request:
    paths:
      - 'kubejs/**/*.js'
      - 'mods/rhino.pw.toml'
      - 'scripts/verify_kubejs_rhino_syntax.py'
      - 'tests/ParseKubeJSSyntax.java'
      - 'tests/ReactiveRhinoRegistration.java'
      - '.github/workflows/kubejs-rhino-syntax.yml'
  push:
    paths:
      - 'kubejs/**/*.js'
      - 'mods/rhino.pw.toml'
      - 'scripts/verify_kubejs_rhino_syntax.py'
      - 'tests/ParseKubeJSSyntax.java'
      - 'tests/ReactiveRhinoRegistration.java'
      - '.github/workflows/kubejs-rhino-syntax.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  parse-all-kubejs:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Parse all scripts and execute isolated Reactive registration with pinned Rhino
        run: python3 scripts/verify_kubejs_rhino_syntax.py --download --reactive-regression
