name: JAWR Cuisine pinned ABI (#450, Type A)

on:
  pull_request:
    paths:
      - 'compat/progression/src/main/java/io/github/heatwaveqc/tyr/progression/runtime/cuisine/**'
      - 'compat/progression/src/main/java/io/github/heatwaveqc/tyr/progression/mixin/BloodCuisine*'
      - 'compat/progression/src/main/resources/tyr_progression_jawr_cuisine.mixins.json'
      - 'mods/just-another-witchery-remake.pw.toml'
      - 'mods/brewin-and-chewin.pw.toml'
      - 'scripts/check_jawr_blood_cuisine_abi.py'
      - '.github/workflows/jawr-cuisine-abi.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pinned-native-abi:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify exact pinned bytes and native JAWR and BnC signatures
        run: python3 scripts/check_jawr_blood_cuisine_abi.py
      - name: Explicit QA boundary
        run: echo 'No NeoForge assembly, Minecraft boot, Prism package or gameplay acceptance.'
