name: Gilded Tyz Overlay - Targeted Source QA
on:
  push:
    paths:
      - 'compat/gilded/**'
      - 'tests/test_gilded_tyz_stage.py'
      - '.github/workflows/gilded-tyz-overlay.yml'
  pull_request:
    paths:
      - 'compat/gilded/**'
      - 'tests/test_gilded_tyz_stage.py'
      - '.github/workflows/gilded-tyz-overlay.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-only:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify Gilded Tyz JSON schema and category patch
        run: python3 compat/gilded/stage_gilded_tyz.py --check
      - name: Test safe merge into an existing Tyz Core Magic and Monk overlay
        run: python3 -m unittest discover -s tests -p 'test_gilded_tyz_stage.py' -v
# This workflow does not run Minecraft, full server smoke, Prism packaging, or packwiz fetching.
