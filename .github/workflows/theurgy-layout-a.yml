name: Type A Theurgy Quest Layout

on:
  pull_request:
    paths:
      - "manifest/theurgy_quest_pilot.json"
      - "manifest/quest_layouts.json"
      - "scripts/build_theurgy_quest_pilot.py"
      - "docs/quest-pilots/theurgy/**"
      - "config/ftbquests/quests/chapters/theurgy.snbt"
      - "index.toml"
      - "pack.toml"
      - "tests/test_theurgy_layout_a.py"
      - ".github/workflows/theurgy-layout-a.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-layout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Regenerate Theurgy preview check (Type A only)
        run: python scripts/build_theurgy_quest_pilot.py --check
      - name: Source/graph/FTB/Packwiz contract (Type A only)
        run: python -m unittest discover -s tests -p test_theurgy_layout_a.py -v
