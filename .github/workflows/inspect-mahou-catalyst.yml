name: Inspect pinned Mahou Catalyst Exchange bytecode (QA only)
on:
  push:
    branches: ['feature/neo-vitae-canonical-dusts']
    paths: ['.github/workflows/inspect-mahou-catalyst.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Inspect publicly published pinned Mahou jar without committing it
        run: |
          set -euo pipefail
          curl -fL --retry 3 --retry-delay 1 -o mahou.jar 'https://cdn.modrinth.com/data/7jOxn6qJ/versions/GrYWbBFj/mahoutsukai-1.21.1-v1.36.31.jar'
          printf '%s  %s\n' '0c4f3bc823d681ad9cb00895d348d2b414201c4d397ca3aa6427b45b8d2b369e0bae8c1f354a9541e4205dadb58c49203d3570e2433d772c3eef1227bc8bfa5a' mahou.jar | sha512sum -c -
          jar tf mahou.jar | grep -iE 'catalyst|exchange|mahoujin' | head -150 | tee classnames.txt
          grep -iE 'catalyst.*\\.class|exchange.*\\.class' classnames.txt | grep -v '\\$' | head -50 | sed 's#/#.#g; s#\\.class$##' > candidates.txt
          while IFS= read -r cls; do
            echo "========== $cls =========="
            javap -classpath mahou.jar -p -c "$cls" 2>&1 || true
          done < candidates.txt > disassembly.txt
          grep -nEi 'ItemEntity|ItemStack|powdered|mana|exchange|catalyst|spawn|discard|shrink' disassembly.txt | head -140
      - name: Upload class names and disassembly (not jar)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pinned-mahou-catalyst-inspection
          path: |
            classnames.txt
            disassembly.txt
            candidates.txt
          if-no-files-found: warn
