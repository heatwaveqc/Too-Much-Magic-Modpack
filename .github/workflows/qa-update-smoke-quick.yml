name: Manual Update Smoke Guard CI (NO GAME BOOT)
on:
  pull_request:
    paths:
      - 'scripts/qa_update_smoke_guard.py'
      - 'tests/test_qa_update_smoke_guard.py'
      - 'scripts/apply_qa_update_overlay.py'
      - 'tests/test_apply_qa_update_overlay.py'
      - 'scripts/prepare_qa_update_economy_compile.py'
      - 'tests/test_prepare_qa_update_economy_compile.py'
      - '.github/workflows/qa-update-smoke.yml'
      - '.github/workflows/qa-update-smoke-quick.yml'
      - 'docs/MOD-UPDATE-QA-PROCESS.md'
  push:
    branches:
      - 'feature/manual-update-smoke-20261121'
    paths:
      - 'scripts/qa_update_smoke_guard.py'
      - 'tests/test_qa_update_smoke_guard.py'
      - 'scripts/apply_qa_update_overlay.py'
      - 'tests/test_apply_qa_update_overlay.py'
      - 'scripts/prepare_qa_update_economy_compile.py'
      - 'tests/test_prepare_qa_update_economy_compile.py'
      - '.github/workflows/qa-update-smoke.yml'
      - '.github/workflows/qa-update-smoke-quick.yml'
      - 'docs/MOD-UPDATE-QA-PROCESS.md'
permissions:
  contents: read
jobs:
  source-only:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Python guard syntax and isolated contract tests
        run: |
          python3 -m py_compile scripts/qa_update_smoke_guard.py tests/test_qa_update_smoke_guard.py scripts/apply_qa_update_overlay.py tests/test_apply_qa_update_overlay.py
          python3 -m unittest discover -s tests -p 'test_apply_qa_update_overlay.py' -v
          python3 -m unittest discover -s tests -p 'test_prepare_qa_update_economy_compile.py' -v
          python3 -m unittest discover -s tests -p 'test_qa_update_smoke_guard.py' -v
      - name: Confirm no automatic game-run events are configured
        run: |
          python3 - <<'PY'
          from pathlib import Path
          text = Path('.github/workflows/qa-update-smoke.yml').read_text()
          assert '  issue_comment:' in text, 'Owner-only manual comment entrypoint missing'
          for other in ('  push:', '  pull_request:', '  schedule:', '  workflow_call:'):
              assert other not in text, f'Automatic or reusable game run event {other}'
          for rule in ('github.event.comment.user.id == 22598785', "github.run_attempt == 1",
                       '/tmm-update smoke ', '/tmm-update prism ',
                       'ref: ${{ steps.authorization.outputs.sha }}',
                       "steps.authorization.outputs.mode == 'prism'",
                       'git push origin "refs/tags/$TAG"',
                       'python3 scripts/build_full_integration_prism.py',
                       'Too-Much-Magic-Four-Mod-Update-Prism-EXPERIMENTAL'):
              assert rule in text, f'Missing exact-SHA guard: {rule}'
          print('PASS: update smoke and experimental Prism are owner-only, single-attempt, server-gated and SHA-locked')
          PY
