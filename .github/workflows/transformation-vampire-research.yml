name: Transformation vampire pinned-JAR research
on:
  push:
    paths:
      - 'scripts/audit_vampire_jars.py'
      - '.github/workflows/transformation-vampire-research.yml'
      - 'mods/just-another-witchery-remake.pw.toml'
      - 'mods/vampirism-become-a-vampire.pw.toml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Verify pinned mods and inspect limited class signatures
        run: python3 scripts/audit_vampire_jars.py
