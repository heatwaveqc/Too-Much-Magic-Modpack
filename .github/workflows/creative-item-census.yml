name: Creative Item Census — historical registry audit (Type A)

on:
  pull_request:
    paths:
      - 'scripts/index_creative_registry.py'
      - 'docs/qa/CREATIVE-ITEM-CENSUS-2026-11-18.json'
      - 'docs/qa/CREATIVE-ITEM-CENSUS.md'
      - 'docs/qa/surveys-2026-11-18/items.csv'
      - '.github/workflows/creative-item-census.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  census:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify registered-item creative candidates against frozen installed inventory
        run: |
          python3 scripts/index_creative_registry.py --check
      - name: Source-only coverage statement
        run: |
          echo 'Historical survey (2026-11-18) only; no active game, recipe scans, acquisition or current 249-mod pack acceptance.'
