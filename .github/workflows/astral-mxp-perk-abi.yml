name: Astral MXP perk pinned ABI (#474 Type A)

on:
  pull_request:
    paths:
      - 'scripts/check_as_mxp_perk_abi.py'
      - 'mods/astral-sorcery.pw.toml'
      - 'compat/progression/src/main/java/io/github/heatwaveqc/tyr/progression/runtime/external/**'
      - '.github/workflows/astral-mxp-perk-abi.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-astral-token-signatures:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify pinned Astral SHA1, native token and attunement methods
        run: python3 scripts/check_as_mxp_perk_abi.py
      - name: Explicit QA scope
        run: echo 'Type A exact binary inspection only; no Minecraft boot, pack assembly or gameplay PASS.'
