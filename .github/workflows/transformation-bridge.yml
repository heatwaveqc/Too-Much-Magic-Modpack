name: Transformation bridge scaffold
on:
  push:
    paths:
      - 'compat/transformations/**'
      - '.github/workflows/transformation-bridge.yml'
  pull_request:
    paths:
      - 'compat/transformations/**'
      - '.github/workflows/transformation-bridge.yml'
permissions:
  contents: read
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: compat/transformations
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'
      - name: Compile and unit test
        run: gradle --no-daemon build
