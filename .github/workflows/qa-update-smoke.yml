name: Manual Owner-Authorized Mod Update QA
run-name: Update QA owner comment ${{ github.event.comment.id }}
on:
  issue_comment:
    types: [created]
permissions:
  contents: read

# An owner command is the sole entrypoint. No push, PR, schedule, or automatic retry
# can assemble/download the entire mod roster, boot the game, or package Prism.
concurrency:
  group: owner-authorized-update-smoke
  cancel-in-progress: false

jobs:
  candidate-update-smoke:
    if: ${{ github.repository == 'heatwaveqc/Too-Much-Magic-Modpack' && github.event.issue.number == 291 && !github.event.issue.pull_request && github.event.comment.author_association == 'OWNER' && github.event.comment.user.id == 22598785 && github.event.sender.id == 22598785 && (startsWith(github.event.comment.body, '/tmm-update smoke ') || startsWith(github.event.comment.body, '/tmm-update prism ')) && github.run_attempt == 1 }}
    runs-on: ubuntu-latest
    timeout-minutes: 100
    permissions:
      contents: write # ONLY one-shot authorization tag, never baseline writes or releases
      actions: read
      issues: read
    env:
      SMOKE_WITH_MODS: '1'
      VERIFY_FULL_QA_INVENTORY: '1'
      SMOKE_TIMEOUT_SECONDS: '900'
    steps:
      - name: Set disposable server directory
        run: echo "WORK_DIR=$RUNNER_TEMP/tmm-update-smoke" >> "$GITHUB_ENV"

      - name: Checkout reviewed authorization guard from trusted main
        uses: actions/checkout@v4
        with:
          ref: main
          path: authorization
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate live owner comment, PR head, green quick CI and reserve one-shot receipt
        id: authorization
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 authorization/scripts/qa_update_smoke_guard.py

      - name: Checkout EXACT owner-authorized candidate commit (never moving integration branch)
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.authorization.outputs.sha }}
          fetch-depth: 0
          path: trial
          persist-credentials: false

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'

      - name: Verify candidate identity and source-only preflight
        working-directory: trial
        env:
          TMM_UPDATE_CANDIDATE_SHA: ${{ steps.authorization.outputs.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TMM_UPDATE_CANDIDATE_SHA"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch --no-tags origin '+refs/heads/*:refs/remotes/origin/*'
          python3 scripts/validate_integration_sources.py
          python3 -m unittest discover -s tests -p 'test_integration_source_preflight.py'
          python3 scripts/validate.py
          python3 scripts/validate_quests.py
          python3 scripts/verify_qa_inventory.py --strict-target

      - name: Resolve four EXACT newer mod files, verify downloaded SHA-512 and pin isolated Packwiz candidate
        working-directory: trial
        env:
          TMM_UPDATE_CANDIDATE_SHA: ${{ steps.authorization.outputs.sha }}
        run: |
          set -euo pipefail
          python3 scripts/prepare_four_mod_update_trial.py --apply --ci
          python3 scripts/validate.py
          python3 scripts/verify_qa_inventory.py --strict-target

      # Keep the canonical assembler's clean-branch invariant intact. This
      # separate checkout is never promoted or pushed; the verified candidate
      # pins are applied only after source assembly in the disposable runner.
      - name: Checkout pristine current test/full-integration for normal assembly
        uses: actions/checkout@v4
        with:
          ref: test/full-integration
          fetch-depth: 0
          path: assembly
          # Only trusted, owner-authorized QA may push the isolated immutable
          # snapshot tag. Never push shared branch heads or release assets.
          persist-credentials: true

      - name: Assemble existing frozen first-party sources using normal clean integration contract
        working-directory: assembly
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch --no-tags origin '+refs/heads/*:refs/remotes/origin/*'
          python3 scripts/validate_integration_sources.py
          python3 scripts/assemble_integration.py
          python3 scripts/validate.py
          python3 scripts/verify_qa_inventory.py --strict-target

      - name: Overlay only the four SHA-512-verified mod updates after clean assembly
        env:
          TMM_UPDATE_CANDIDATE_SHA: ${{ steps.authorization.outputs.sha }}
        run: |
          set -euo pipefail
          python3 authorization/scripts/apply_qa_update_overlay.py \
            --trial trial --assembled assembly --candidate-sha "$TMM_UPDATE_CANDIDATE_SHA"

      - name: Validate assembled integration plus four updates (isolated QA)
        working-directory: assembly
        run: |
          set -euo pipefail
          python3 scripts/verify_qa_inventory.py --strict-target
          python3 scripts/validate.py
          python3 scripts/verify_next_test_roster.py
          python3 scripts/verify_unified_progression.py
          python3 scripts/validate_quests.py
          python3 scripts/verify_materials.py
          python3 scripts/verify_dragon_diets.py
          python3 scripts/verify_retirement.py
          python3 scripts/validate_progression_gates.py
          python3 scripts/verify_silver_equipment.py
          node scripts/verify_dragon_seasoned_fish.cjs
          python3 tests/test_prism_qa_packaging.py
          if test -f integration/hexcast-media-pilot/check-contract.sh; then
            (cd integration/hexcast-media-pilot && bash check-contract.sh)
          fi

      - name: Verify four upgrade pins survived assembly (do not silently revert)
        working-directory: assembly
        run: |
          python3 - <<'PY'
          import json, pathlib, tomllib
          mods = {x['id']: x for x in json.loads(pathlib.Path('manifest/mods.json').read_text())['mods']}
          expected = {
              'neovitae': 'neovitae-1.21.1-1.1.54.jar',
              'evilcraft': 'evilcraft-1.21.1-neoforge-1.2.102.jar',
              'goety': 'goety-3.2.3.jar',
              'ars-elemental': 'ars_elemental-1.21.1-0.7.11.3.jar',
          }
          for key, name in expected.items():
              pin = tomllib.loads(pathlib.Path(f'mods/{key}.pw.toml').read_text())
              assert pin['filename'] == name, f'candidate pin reverted: {key}'
              assert pin['download']['hash-format'] == 'sha512', key
              assert mods[key]['enabled_in_pack'], key
          print('PASS: all four newer mods remain selected after assembly')
          PY

      - name: Rebind Economy exact compile-only filenames to SHA-512-verified updated JARs
        env:
          TMM_UPDATE_CANDIDATE_SHA: ${{ steps.authorization.outputs.sha }}
        run: |
          python3 authorization/scripts/prepare_qa_update_economy_compile.py \
            --assembly assembly --candidate-sha "$TMM_UPDATE_CANDIDATE_SHA"

      - name: Compile and unit test all selected first-party runtime modules
        working-directory: assembly
        run: |
          python3 scripts/first_party_runtime.py build
          paths="$(python3 scripts/first_party_runtime.py paths)"
          echo "SMOKE_EXTRA_MOD_JARS=$paths" >> "$GITHUB_ENV"

      - name: Capture exact candidate metadata and rollback provenance BEFORE boot
        working-directory: assembly
        env:
          TMM_UPDATE_CANDIDATE_SHA: ${{ steps.authorization.outputs.sha }}
          TMM_UPDATE_CANDIDATE_BRANCH: ${{ steps.authorization.outputs.branch }}
        run: |
          set -euo pipefail
          mkdir -p "${{ runner.temp }}/tmm-update-evidence"
          cp pack.toml index.toml manifest/mods.json "${{ runner.temp }}/tmm-update-evidence/"
          for name in neovitae evilcraft goety ars-elemental; do
            cp "mods/$name.pw.toml" "${{ runner.temp }}/tmm-update-evidence/$name.pw.toml"
          done
          git diff --binary -- manifest/mods.json index.toml pack.toml mods/neovitae.pw.toml mods/evilcraft.pw.toml mods/goety.pw.toml mods/ars-elemental.pw.toml > "${{ runner.temp }}/tmm-update-evidence/packwiz-changes.patch"
          printf '%s\n' "SOURCE_SHA=$TMM_UPDATE_CANDIDATE_SHA" "SOURCE_BRANCH=$TMM_UPDATE_CANDIDATE_BRANCH" "ASSEMBLED_BASE=$(git rev-parse HEAD)" "ROLLBACK_BASE=2373d50732866e460dc9e9454f7187f9045e1cdc" > "${{ runner.temp }}/tmm-update-evidence/provenance.txt"
          sha256sum pack.toml index.toml mods/neovitae.pw.toml mods/evilcraft.pw.toml mods/goety.pw.toml mods/ars-elemental.pw.toml | tee "${{ runner.temp }}/tmm-update-evidence/checksums.txt"

      - name: OWNER-AUTHORIZED full NeoForge server boot with four upgraded mods and first-party jars
        working-directory: assembly
        run: bash scripts/smoke_server.sh

      - name: Verify first-party JARs actually loaded and mandatory retirement rules
        working-directory: assembly
        run: |
          set -euo pipefail
          python3 scripts/first_party_runtime.py verify-smoke --mods-dir "$WORK_DIR/mods"
          python3 scripts/verify_retirement.py
          printf '%s\n' "## Four-mod update trial: SERVER BOOT SMOKE PASSED" >> "$GITHUB_STEP_SUMMARY"
          printf '%s\n' "Candidate source: ${{ steps.authorization.outputs.sha }}; no integration branch writes, no Prism/client gameplay." >> "$GITHUB_STEP_SUMMARY"

      # A client instance must reference a reachable immutable commit that
      # contains *the updated* Packwiz index and the exact server-tested pins.
      # This is a separate QA-only tag, never a shared branch push, promotion,
      # rolling prerelease, or implicit approval of Ars Elemental beta.
      - name: Freeze immutable isolated four-update Prism QA snapshot
        if: ${{ steps.authorization.outputs.mode == 'prism' }}
        working-directory: assembly
        env:
          QA_NONCE: ${{ steps.authorization.outputs.nonce }}
          QA_CANDIDATE_SHA: ${{ steps.authorization.outputs.sha }}
        run: |
          set -euo pipefail
          test -n "$QA_NONCE"
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "$(git branch --show-current)" = test/full-integration
          test "$(git rev-parse HEAD)" = "$(git rev-parse refs/remotes/origin/test/full-integration)"
          git add -- mods config defaultconfigs kubejs
          git add -- manifest/mods.json manifest/integration-lock.json pack.toml index.toml compat/economy/build.gradle
          # The immutable source must include all server-tested changes,
          # but must not include compiled JARs or any unreviewed assets.
          git diff --exit-code
          if git diff --cached --quiet; then
            echo "Refusing a Prism snapshot with no staged integration/update changes"
            exit 1
          fi
          python3 scripts/validate.py
          python3 scripts/verify_qa_inventory.py --strict-target
          git commit -m "test: freeze four-mod owner-authorized server-smoked Prism QA snapshot"
          SNAPSHOT="$(git rev-parse HEAD)"
          test "$SNAPSHOT" != "$QA_CANDIDATE_SHA"
          git diff --exit-code HEAD
          python3 scripts/validate.py
          python3 scripts/verify_qa_inventory.py --strict-target
          TAG="qa-update-prism/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          git tag -a "$TAG" -m "EXPERIMENTAL four-mod server-smoked Prism QA snapshot; includes Ars Elemental BETA; source $QA_CANDIDATE_SHA"
          # Explicit tag-only push: the remote test/full-integration branch is
          # not updated, and no stable/rolling prerelease is overwritten.
          git push origin "refs/tags/$TAG"
          test "$(git ls-remote --tags origin "refs/tags/$TAG^{}" | cut -f1)" = "$SNAPSHOT"
          echo "QA_PRISM_SNAPSHOT=$SNAPSHOT" >> "$GITHUB_ENV"
          echo "QA_PRISM_TAG=$TAG" >> "$GITHUB_ENV"
          echo "Isolated Prism source commit: $SNAPSHOT"
          echo "Isolated owner-only QA tag: $TAG"

      - name: Obtain exact official packwiz installer bootstrap (experimental Prism only)
        if: ${{ steps.authorization.outputs.mode == 'prism' }}
        run: |
          set -euo pipefail
          curl -fL --retry 3 --retry-delay 2 \
            -o "${{ runner.temp }}/packwiz-installer-bootstrap.jar" \
            "https://github.com/packwiz/packwiz-installer-bootstrap/releases/download/v0.0.3/packwiz-installer-bootstrap.jar"
          test "$(stat -c %s "${{ runner.temp }}/packwiz-installer-bootstrap.jar")" -eq 98989

      - name: Verify immutable GitHub Packwiz snapshot is reachable
        if: ${{ steps.authorization.outputs.mode == 'prism' }}
        working-directory: assembly
        run: |
          set -euo pipefail
          curl -fL --retry 5 --retry-delay 2 --retry-all-errors \
            -o "${{ runner.temp }}/four-mod-remote-pack.toml" \
            "https://raw.githubusercontent.com/heatwaveqc/Too-Much-Magic-Modpack/$QA_PRISM_SNAPSHOT/pack.toml"
          cmp pack.toml "${{ runner.temp }}/four-mod-remote-pack.toml"

      - name: Produce single-level directly importable experimental four-mod Prism ZIP
        if: ${{ steps.authorization.outputs.mode == 'prism' }}
        working-directory: assembly
        run: |
          set -euo pipefail
          IFS=: read -r -a jars <<< "$SMOKE_EXTRA_MOD_JARS"
          test "${#jars[@]}" -eq 4
          python3 scripts/build_full_integration_prism.py \
            "${{ runner.temp }}/packwiz-installer-bootstrap.jar" \
            "${{ runner.temp }}" "$QA_PRISM_SNAPSHOT" "${jars[@]}"
          test -f "${{ runner.temp }}/Too-Much-Magic-Full-Integration-Prism.zip/instance.cfg"
          test -f "${{ runner.temp }}/Too-Much-Magic-Full-Integration-Prism.zip/BUILD-MANIFEST.json"
          python3 - <<'PY'
          import json, os, pathlib
          root = pathlib.Path(os.environ['RUNNER_TEMP']) / 'Too-Much-Magic-Full-Integration-Prism.zip'
          meta = json.loads((root/'BUILD-MANIFEST.json').read_text())
          assert meta['integration_commit'] == os.environ['QA_PRISM_SNAPSHOT']
          assert meta['update_trial']['candidate_sha'] == 'bdb07f2823540a3dde422a6702f5eed8375883ca'
          assert len(meta['custom_jar_sha256']) == 4
          assert meta['client_tested'] is False and meta['stable_promoted'] is False
          assert meta['personal_settings']['public_release'] is False
          print('PASS: experimental client ZIP locked to exact four-mod server-smoked snapshot')
          PY

      - name: Upload experimental four-mod Prism QA ZIP (no public release)
        if: ${{ steps.authorization.outputs.mode == 'prism' }}
        uses: actions/upload-artifact@v4
        with:
          name: Too-Much-Magic-Four-Mod-Update-Prism-EXPERIMENTAL
          path: ${{ runner.temp }}/Too-Much-Magic-Full-Integration-Prism.zip
          if-no-files-found: error
          retention-days: 30

      - name: Report experimental Prism QA package as built, NOT client-tested
        if: ${{ steps.authorization.outputs.mode == 'prism' }}
        run: |
          echo "## Experimental four-mod Prism QA package PASSED; no client launch or gameplay acceptance" >> "$GITHUB_STEP_SUMMARY"
          echo "Source commit: \`$QA_PRISM_SNAPSHOT\`; immutable tag: \`$QA_PRISM_TAG\`. Includes Ars Elemental beta; no promotion." >> "$GITHUB_STEP_SUMMARY"

      - name: Retain update hashes, Packwiz diff and server logs (never third-party JARs)
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: Four-Mod-Update-Isolated-Smoke-Evidence
          path: |
            ${{ runner.temp }}/tmm-update-evidence/
            ${{ runner.temp }}/tmm-update-smoke/server.log
            ${{ runner.temp }}/tmm-update-smoke/logs/latest.log
          retention-days: 30
          if-no-files-found: warn
