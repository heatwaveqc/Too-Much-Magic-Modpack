name: Friendship Garden policy (static only)

on:
  pull_request:
    paths:
      - 'compat/friendship-garden/**'
      - '.github/workflows/friendship-garden-policy.yml'
  push:
    branches:
      - 'feature/friendship-garden-*'
    paths:
      - 'compat/friendship-garden/**'
      - '.github/workflows/friendship-garden-policy.yml'

permissions:
  contents: read

jobs:
  policy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: compat/friendship-garden
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'
      - run: gradle --no-daemon test
