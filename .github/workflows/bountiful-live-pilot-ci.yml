name: Bountiful next-live-test pilot (source only, NO GAME BOOT)
on:
  pull_request:
    paths:
      - 'manifest/bountiful-live-pilot-review.json'
      - 'compat/bountiful/live-pilot/**'
      - 'scripts/build_bountiful_live_pilot.py'
      - 'scripts/compile_bountiful_contracts.py'
      - 'tests/test_bountiful_live_pilot.py'
      - '.github/workflows/bountiful-live-pilot-ci.yml'
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify exact 14 files and native guardrails
        run: |
          python scripts/build_bountiful_live_pilot.py --verify
          python -m unittest discover -s tests -p 'test_bountiful_live_pilot.py' -v
