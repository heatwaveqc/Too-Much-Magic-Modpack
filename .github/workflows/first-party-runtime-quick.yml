name: Manifest-selected first-party modules and offline Prism package (NO GAME BOOT)
on:
  pull_request:
    paths:
      - 'manifest/first-party-runtime.json'
      - 'compat/*/LICENSE'
      - 'compat/*/THIRD_PARTY_NOTICES.md'
      - 'compat/*/gradle.properties'
      - 'compat/*/build.gradle'
      - 'compat/*/src/main/templates/META-INF/neoforge.mods.toml'
      - 'scripts/first_party_runtime.py'
      - 'scripts/build_full_integration_prism.py'
      - 'tests/test_prism_qa_packaging.py'
      - '.github/workflows/first-party-runtime-quick.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compile-and-package-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Offline synthetic ZIP regression
        run: python3 tests/test_prism_qa_packaging.py
      - name: Compile selected modules and verify JAR metadata
        run: |
          python3 scripts/first_party_runtime.py build
          python3 scripts/first_party_runtime.py paths
