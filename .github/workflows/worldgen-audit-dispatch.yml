name: Owner-authorized worldgen pilot dispatch
run-name: Validate worldgen audit request comment ${{ github.event.comment.id }}
on:
  issue_comment:
    types: [created]
permissions:
  contents: read
concurrency:
  group: owner-qa-command-bridge
  cancel-in-progress: false
jobs:
  authorize-and-dispatch:
    if: ${{ github.repository == 'heatwaveqc/Too-Much-Magic-Modpack' && github.event.issue.number == 746 && !github.event.issue.pull_request && github.event.comment.author_association == 'OWNER' && github.event.comment.user.id == 22598785 && github.event.sender.id == 22598785 && startsWith(github.event.comment.body, '/tmm worldgen ') && github.run_attempt == 1 }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      actions: write
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate request and dispatch manual pilot only
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/worldgen_audit_dispatch.py
