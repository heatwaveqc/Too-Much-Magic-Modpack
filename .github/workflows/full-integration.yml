name: Full Integration - Quick CI / Manual Assembly / Authorized Smoke
on:
  push:
    branches: ['test/full-integration']
    paths:
      - '.github/workflows/full-integration.yml'
      - 'scripts/assemble_integration.py'
      - 'scripts/validate_integration_sources.py'
      - 'manifest/mods.json'
      - 'AGENTS.md'
      - '.gitattributes'
      - 'scripts/pin_next_test_mods.py'
      - 'scripts/retire_teamlapen.py'
      - 'scripts/verify_retirement.py'
      - 'scripts/verify_next_test_roster.py'
      - 'scripts/validate_quests.py'
      - 'compat/progression/**'
      - 'compat/**'
      - 'manifest/first-party-runtime.json'
      - 'scripts/first_party_runtime.py'
      - 'tests/test_prism_qa_packaging.py'
      - 'kubejs/server_scripts/silver_equipment_unification.js'
      - 'kubejs/startup_scripts/silver_equipment_stats.js'
      - 'scripts/build_full_integration_prism.py'
      - 'scripts/tmm_qa_preferences.ps1'
      - 'scripts/prism_qa_options.txt'
      - 'scripts/IMPORT-OLD-TMM-PREFERENCES.cmd'
      - 'scripts/smoke_server.sh'
      - 'kubejs/server_scripts/dragon_seasoned_fish.js'
      - 'scripts/verify_dragon_seasoned_fish.cjs'
      - 'manifest/integration-sources.json'
      - '.packwizignore'
  workflow_dispatch:
    inputs:
      assemble_only:
        description: 'Owner-authorized integration assembly without server boot or Prism package'
        type: boolean
        required: false
        default: false
      full_smoke:
        description: 'Owner-authorized full NeoForge server smoke and immutable Prism QA ZIP (unchecked = quick checks only)'
        type: boolean
        required: false
        default: false
      expected_integration_sha:
        description: 'Optional exact 40-hex approved integration head; required for bridge dispatch'
        type: string
        required: false
        default: ''
      package_prism:
        description: 'After authorized successful smoke, publish Prism QA package (false = smoke only)'
        type: boolean
        required: false
        default: true
      qa_request_id:
        description: 'One-shot bridge request nonce; blank for direct manual owner invocation'
        type: string
        required: false
        default: ''
  workflow_call:
    inputs:
      assemble_only:
        description: 'Explicitly authorized source assembly; no server boot'
        type: boolean
        required: false
        default: false
      full_smoke:
        description: 'Must be true ONLY after explicit owner instruction for this full smoke run'
        type: boolean
        required: false
        default: false

      expected_integration_sha:
        description: 'Optional exact 40-hex approved integration head; required for bridge dispatch'
        type: string
        required: false
        default: ''
      package_prism:
        description: 'After authorized successful smoke, publish Prism QA package (false = smoke only)'
        type: boolean
        required: false
        default: true
      qa_request_id:
        description: 'One-shot bridge request nonce; blank for direct manual owner invocation'
        type: string
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  # Routine quick runs supersede stale quick runs; approved full smokes are never canceled.
  # The former overnight full-smoke group remains untouched by this change.
  group: full-integration-${{ inputs.full_smoke == true && 'approved-smoke' || 'quick' }}
  cancel-in-progress: ${{ inputs.full_smoke != true }}

jobs:
  integration-preflight-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          ref: test/full-integration
          fetch-depth: 0
          persist-credentials: true
      - name: Verify authorized integration SHA and one-shot request
        if: ${{ inputs.full_smoke == true || inputs.assemble_only == true }}
        env:
          EXPECTED_SHA: ${{ inputs.expected_integration_sha }}
          REQUEST_ID: ${{ inputs.qa_request_id }}
          FULL_SMOKE: ${{ inputs.full_smoke }}
        run: |
          set -euo pipefail
          if [[ -n "$EXPECTED_SHA" ]]; then
            [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]
            [[ "$(git rev-parse HEAD)" == "$EXPECTED_SHA" ]] || { echo "Approved integration head advanced; new approval needed"; exit 1; }
          fi
          if [[ -n "$REQUEST_ID" ]]; then
            [[ "$FULL_SMOKE" == true && "$REQUEST_ID" =~ ^[0-9a-f]{32}$ && -n "$EXPECTED_SHA" ]]
            [[ "$GITHUB_RUN_ATTEMPT" == 1 ]] || { echo "Bridge requests cannot be rerun; obtain fresh owner approval"; exit 1; }
            [[ "$(git ls-remote --refs origin "refs/tags/qa-request/$REQUEST_ID" | cut -f1)" == "$EXPECTED_SHA" ]] || { echo "Missing or mismatched authorization receipt"; exit 1; }
          fi
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'
      - name: Fetch source refs for read-only preflight
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch --no-tags origin '+refs/heads/*:refs/remotes/origin/*'
      - name: Integration Preflight — frozen source refs, no writes or mod downloads
        run: |
          python3 scripts/validate_integration_sources.py
          python3 -m unittest discover -s tests -p 'test_integration_source_preflight.py'
          python3 scripts/validate.py
          python3 scripts/validate_quests.py
          python3 -m py_compile scripts/validate_integration_sources.py scripts/assemble_integration.py scripts/activate_tyzs.py scripts/stage_monk_tyz.py scripts/pin_next_test_mods.py scripts/verify_next_test_roster.py scripts/verify_tyz_migration.py scripts/retire_teamlapen.py scripts/verify_retirement.py scripts/build_full_integration_prism.py
      - name: Integration Assembly — explicitly authorized, never on automatic push
        if: ${{ (github.event_name == 'workflow_dispatch' || github.event_name == 'workflow_call') && (inputs.full_smoke == true || inputs.assemble_only == true) }}
        run: |
          python3 scripts/assemble_integration.py
          python3 scripts/validate.py
          python3 scripts/verify_tyz_migration.py
          python3 scripts/verify_next_test_roster.py
          python3 scripts/validate_quests.py
      - name: Baseline silver and Seasoned Fish source checks (quick)
        run: |
          python3 scripts/verify_silver_equipment.py
          node scripts/verify_dragon_seasoned_fish.cjs
      - name: Verify imported materials, dragon diets and retirement (authorized assembly only)
        if: ${{ (github.event_name == 'workflow_dispatch' || github.event_name == 'workflow_call') && (inputs.full_smoke == true || inputs.assemble_only == true) }}
        run: |
          python3 scripts/verify_materials.py
          python3 scripts/verify_dragon_diets.py
          python3 scripts/verify_retirement.py
      - name: Validate baseline ProjectE progression gates (quick)
        run: python3 scripts/validate_progression_gates.py
      - name: Validate donor-only ProjectE and audit scripts (authorized assembly only)
        if: ${{ (github.event_name == 'workflow_dispatch' || github.event_name == 'workflow_call') && (inputs.full_smoke == true || inputs.assemble_only == true) }}
        run: |
          python3 -m py_compile scripts/audit_jawr_food_jar.py scripts/verify_emc_coverage_audit.py
          node scripts/verify_projecte_boss_recipes.cjs
          python3 scripts/verify_emc_coverage_audit.py
      - name: Re-validate live-staged Tyz 99-rank Core Magic source (exclusive skill backend)
        run: python3 compat/magic/stage_preview.py --check
      - name: Compile and unit test all explicitly selected first-party modules
        run: python3 scripts/first_party_runtime.py build
      - name: Resolve exact built first-party JAR paths
        run: |
          paths="$(python3 scripts/first_party_runtime.py paths)"
          echo "SMOKE_EXTRA_MOD_JARS=$paths" >> "$GITHUB_ENV"
      - name: Offline regression for manifest-driven Prism packaging
        run: python3 tests/test_prism_qa_packaging.py
      - name: Verify HexCast MXP donor contract (authorized assembly only)
        if: ${{ (github.event_name == 'workflow_dispatch' || github.event_name == 'workflow_call') && (inputs.full_smoke == true || inputs.assemble_only == true) }}
        working-directory: integration/hexcast-media-pilot
        run: bash check-contract.sh
      - name: Report server boot omitted without explicit full_smoke authorization
        if: ${{ inputs.full_smoke != true }}
        run: |
          echo '## Quick checks only — no server smoke or Prism QA ZIP' >> "$GITHUB_STEP_SUMMARY"
          echo 'Static checks and selected-module Gradle compile/unit tests ran. A server-tested build requires explicit owner authorization and a manual full_smoke=true invocation.' >> "$GITHUB_STEP_SUMMARY"
      - name: Full dedicated-server smoke with selected first-party runtime modules
        if: ${{ inputs.full_smoke == true && (github.event_name == 'workflow_dispatch' || github.event_name == 'workflow_call') }}
        env:
          SMOKE_WITH_MODS: '1'
          SMOKE_TIMEOUT_SECONDS: '900'
          WORK_DIR: ${{ runner.temp }}/tmm-full-integration-smoke
        run: bash scripts/smoke_server.sh
      - name: Validate retired runtime mods, recipes and tag absence
        if: ${{ inputs.full_smoke == true && (github.event_name == 'workflow_dispatch' || github.event_name == 'workflow_call') }}
        run: python3 scripts/verify_retirement.py
      - name: Collect read-only JAWR and Forbidden Magic bytecode food inventory
        if: ${{ inputs.full_smoke == true && (github.event_name == 'workflow_dispatch' || github.event_name == 'workflow_call') }}
        run: |
          python3 scripts/audit_jawr_food_jar.py \
            "${{ runner.temp }}/tmm-full-integration-smoke/mods/witchery-0.5.39+mc1.21.1.jar" \
            "${{ runner.temp }}/tmm-full-integration-smoke/mods/witchery_forbidden_magic-0.5.37+mc1.21.1.jar" \
            --limit 48 --output "${{ runner.temp }}/tmm-jawr-food-audit"
      - name: Fail if standalone module is absent or retired modules leak
        if: ${{ inputs.full_smoke == true && (github.event_name == 'workflow_dispatch' || github.event_name == 'workflow_call') }}
        run: |
          python3 scripts/first_party_runtime.py verify-smoke --mods-dir "${{ runner.temp }}/tmm-full-integration-smoke/mods"
      - name: Freeze immutable, server-tested integration snapshot without moving rolling branch
        if: ${{ inputs.full_smoke == true && (github.event_name == 'workflow_dispatch' || github.event_name == 'workflow_call') }}
        run: |
          # All staged source imports, exact mod manifests and the source lock belong
          # to the tested snapshot. Never push it back to test/full-integration:
          # parallel feature edits may advance that configuration branch meanwhile.
          # Imported source paths are already explicitly staged by the assembler.
          # Stage generated packwiz/lock files only, never Gradle build/ outputs.
          git add manifest/mods.json manifest/integration-lock.json pack.toml index.toml
          if ! git diff --cached --quiet; then
            git commit -m "test: freeze all-source full integration QA snapshot"
          fi
          git diff --exit-code
          python3 scripts/validate.py
          python3 scripts/validate_quests.py
          TAG="integration-qa/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          git tag -a "$TAG" -m "UNSTABLE full integration server-smoked snapshot $(git rev-parse HEAD)"
          git push origin "refs/tags/$TAG"
          echo "Snapshot immutable commit: $(git rev-parse HEAD)"
          echo "Snapshot tag: $TAG"
      - name: Report smoke-only success without Prism publication
        if: ${{ inputs.full_smoke == true && inputs.package_prism == false && (github.event_name == 'workflow_dispatch' || github.event_name == 'workflow_call') }}
        run: echo '## Server Boot Smoke passed; Prism QA Package explicitly omitted' >> "$GITHUB_STEP_SUMMARY"
      - name: Obtain official packwiz bootstrap
        if: ${{ inputs.full_smoke == true && inputs.package_prism == true && (github.event_name == 'workflow_dispatch' || github.event_name == 'workflow_call') }}
        run: |
          curl -fL --retry 3 --retry-delay 2 \
            -o "${{ runner.temp }}/packwiz-installer-bootstrap.jar" \
            "https://github.com/packwiz/packwiz-installer-bootstrap/releases/download/v0.0.3/packwiz-installer-bootstrap.jar"
          test "$(stat -c %s "${{ runner.temp }}/packwiz-installer-bootstrap.jar")" -eq 98989
      - name: Produce commit-locked all-workstreams Prism client ZIP
        if: ${{ inputs.full_smoke == true && inputs.package_prism == true && (github.event_name == 'workflow_dispatch' || github.event_name == 'workflow_call') }}
        run: |
          IFS=: read -r -a jars <<< "$SMOKE_EXTRA_MOD_JARS"
          python3 scripts/build_full_integration_prism.py \
            "${{ runner.temp }}/packwiz-installer-bootstrap.jar" \
            "${{ runner.temp }}" "$(git rev-parse HEAD)" "${jars[@]}"
      - name: Upload the one comprehensive unstable test build
        if: ${{ inputs.full_smoke == true && inputs.package_prism == true && (github.event_name == 'workflow_dispatch' || github.event_name == 'workflow_call') }}
        uses: actions/upload-artifact@v4
        with:
          name: Too-Much-Magic-Full-Integration-Prism-UNSTABLE
          path: ${{ runner.temp }}/Too-Much-Magic-Full-Integration-Prism.zip
          if-no-files-found: error
          retention-days: 30
      - name: Always retain diagnostics and exact source provenance
        if: ${{ always() && inputs.full_smoke == true && (github.event_name == 'workflow_dispatch' || github.event_name == 'workflow_call') }}
        uses: actions/upload-artifact@v4
        with:
          name: Full-Integration-Test-Evidence
          path: |
            manifest/integration-sources.json
            manifest/integration-lock.json
            ${{ runner.temp }}/tmm-full-integration-smoke/server.log
            ${{ runner.temp }}/tmm-full-integration-smoke/logs/latest.log
            ${{ runner.temp }}/tmm-jawr-food-audit/
          retention-days: 30
          if-no-files-found: warn
