name: Full Integration - Quick CI (full server smoke opt-in)
on:
  push:
    branches: ['test/full-integration']
    paths:
      - '.github/workflows/full-integration.yml'
      - 'scripts/assemble_integration.py'
      - 'scripts/pin_next_test_mods.py'
      - 'scripts/retire_teamlapen.py'
      - 'scripts/verify_retirement.py'
      - 'scripts/verify_next_test_roster.py'
      - 'scripts/validate_quests.py'
      - 'compat/progression/**'
      - 'compat/transformations/**'
      - 'tests/test_prism_qa_packaging.py'
      - 'kubejs/server_scripts/silver_equipment_unification.js'
      - 'kubejs/startup_scripts/silver_equipment_stats.js'
      - 'scripts/build_full_integration_prism.py'
      - 'scripts/tmm_qa_preferences.ps1'
      - 'scripts/prism_qa_options.txt'
      - 'scripts/IMPORT-OLD-TMM-PREFERENCES.cmd'
      - 'scripts/smoke_server.sh'
      - 'manifest/integration-sources.json'
      - '.packwizignore'
  workflow_dispatch:
    inputs:
      full_smoke:
        description: 'Owner-authorized full NeoForge server smoke and immutable Prism QA ZIP (unchecked = quick checks only)'
        type: boolean
        required: false
        default: false
  workflow_call:
    inputs:
      full_smoke:
        description: 'Must be true ONLY after explicit owner instruction for this full smoke run'
        type: boolean
        required: false
        default: false

permissions:
  contents: write

concurrency:
  # Routine quick runs supersede stale quick runs; approved full smokes are never canceled.
  # The former overnight full-smoke group remains untouched by this change.
  group: full-integration-${{ inputs.full_smoke == true && 'approved-smoke' || 'quick' }}
  cancel-in-progress: ${{ inputs.full_smoke != true }}

jobs:
  combine-build-smoke-package:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          ref: test/full-integration
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'
      - name: Fetch working-branch heads and configure safe integration writes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch --no-tags origin '+refs/heads/*:refs/remotes/origin/*'
      - name: Assemble all registered workstreams and fail on unclassified active branches
        run: |
          python3 scripts/assemble_integration.py
          python3 scripts/validate.py
          python3 scripts/verify_tyz_migration.py
          python3 scripts/verify_next_test_roster.py
          python3 scripts/validate_quests.py
          python3 -m py_compile scripts/assemble_integration.py scripts/activate_tyzs.py scripts/stage_monk_tyz.py scripts/pin_next_test_mods.py scripts/verify_next_test_roster.py scripts/audit_jawr_food_jar.py scripts/verify_tyz_migration.py scripts/retire_teamlapen.py scripts/verify_retirement.py scripts/build_full_integration_prism.py
      - name: Confirm changed resource recipes and materials statically
        run: |
          python3 scripts/verify_materials.py
          python3 scripts/verify_silver_equipment.py
          python3 scripts/verify_dragon_diets.py
          python3 scripts/verify_retirement.py
      - name: Verify every ProjectE recipe override and explicit EMC exception audit contract
        run: |
          node scripts/verify_projecte_boss_recipes.cjs
          python3 scripts/verify_emc_coverage_audit.py
          python3 scripts/validate_progression_gates.py
      - name: Re-validate live-staged Tyz 99-rank Core Magic source (exclusive skill backend)
        run: python3 compat/magic/stage_preview.py --check
      - name: Compile and unit test standalone Monk/Hunter progression
        working-directory: compat/progression
        run: gradle --no-daemon build
      - name: Compile and unit test JAWR-only transformation bridge
        working-directory: compat/transformations
        run: gradle --no-daemon build
      - name: Offline regression for two-JAR Prism packaging
        run: python3 tests/test_prism_qa_packaging.py
      - name: Verify HexCast MXP exploratory contract (source only; not in pack)
        working-directory: integration/hexcast-media-pilot
        run: bash check-contract.sh
      - name: Note quick checks are NOT a full smoke
        if: ${{ inputs.full_smoke != true }}
        run: |
          echo '## Quick checks only — no server smoke or Prism QA ZIP' >> "$GITHUB_STEP_SUMMARY"
          echo 'Static checks and two-module Gradle compile/unit tests ran. A server-tested build requires explicit owner authorization and a manual full_smoke=true invocation.' >> "$GITHUB_STEP_SUMMARY"
      - name: Full dedicated-server smoke WITH Monk, Hunter and JAWR transformation bridge
        if: ${{ inputs.full_smoke == true && (github.event_name == 'workflow_dispatch' || github.event_name == 'workflow_call') }}
        env:
          SMOKE_WITH_MODS: '1'
          SMOKE_TIMEOUT_SECONDS: '900'
          WORK_DIR: ${{ runner.temp }}/tmm-full-integration-smoke
          SMOKE_EXTRA_MOD_JARS: '${{ github.workspace }}/compat/progression/build/libs/tmm_progression-0.1.0-dev.jar:${{ github.workspace }}/compat/transformations/build/libs/tmm_transformations-0.1.0-dev.jar'
        run: bash scripts/smoke_server.sh
      - name: Validate retired runtime mods, recipes and tag absence
        if: ${{ inputs.full_smoke == true && (github.event_name == 'workflow_dispatch' || github.event_name == 'workflow_call') }}
        run: python3 scripts/verify_retirement.py
      - name: Collect read-only JAWR and Forbidden Magic bytecode food inventory
        if: ${{ inputs.full_smoke == true && (github.event_name == 'workflow_dispatch' || github.event_name == 'workflow_call') }}
        run: |
          python3 scripts/audit_jawr_food_jar.py \
            "${{ runner.temp }}/tmm-full-integration-smoke/mods/witchery-0.5.39+mc1.21.1.jar" \
            "${{ runner.temp }}/tmm-full-integration-smoke/mods/witchery_forbidden_magic-0.5.37+mc1.21.1.jar" \
            --limit 48 --output "${{ runner.temp }}/tmm-jawr-food-audit"
      - name: Fail if standalone module is absent or retired modules leak
        if: ${{ inputs.full_smoke == true && (github.event_name == 'workflow_dispatch' || github.event_name == 'workflow_call') }}
        run: |
          test -f "${{ runner.temp }}/tmm-full-integration-smoke/mods/tmm_progression-0.1.0-dev.jar"
          test "$(find "${{ runner.temp }}/tmm-full-integration-smoke/mods" -maxdepth 1 -name 'tmm_*.jar' | wc -l)" -eq 2
          test ! -f "${{ runner.temp }}/tmm-full-integration-smoke/mods/tmm_monk-0.1.0-dev.jar"
          test -f "${{ runner.temp }}/tmm-full-integration-smoke/mods/tmm_transformations-0.1.0-dev.jar"
          echo "Standalone tmm_progression and JAWR-only tmm_transformations both server-tested; old tmm_monk absent"
      - name: Freeze immutable, server-tested integration snapshot without moving rolling branch
        if: ${{ inputs.full_smoke == true && (github.event_name == 'workflow_dispatch' || github.event_name == 'workflow_call') }}
        run: |
          # All staged source imports, exact mod manifests and the source lock belong
          # to the tested snapshot. Never push it back to test/full-integration:
          # parallel feature edits may advance that configuration branch meanwhile.
          # Imported source paths are already explicitly staged by the assembler.
          # Stage generated packwiz/lock files only, never Gradle build/ outputs.
          git add manifest/mods.json manifest/integration-lock.json pack.toml index.toml
          if ! git diff --cached --quiet; then
            git commit -m "test: freeze all-source full integration QA snapshot"
          fi
          git diff --exit-code
          python3 scripts/validate.py
          python3 scripts/validate_quests.py
          TAG="integration-qa/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          git tag -a "$TAG" -m "UNSTABLE full integration server-smoked snapshot $(git rev-parse HEAD)"
          git push origin "refs/tags/$TAG"
          echo "Snapshot immutable commit: $(git rev-parse HEAD)"
          echo "Snapshot tag: $TAG"
      - name: Obtain official packwiz bootstrap
        if: ${{ inputs.full_smoke == true && (github.event_name == 'workflow_dispatch' || github.event_name == 'workflow_call') }}
        run: |
          curl -fL --retry 3 --retry-delay 2 \
            -o "${{ runner.temp }}/packwiz-installer-bootstrap.jar" \
            "https://github.com/packwiz/packwiz-installer-bootstrap/releases/download/v0.0.3/packwiz-installer-bootstrap.jar"
          test "$(stat -c %s "${{ runner.temp }}/packwiz-installer-bootstrap.jar")" -eq 98989
      - name: Produce commit-locked all-workstreams Prism client ZIP
        if: ${{ inputs.full_smoke == true && (github.event_name == 'workflow_dispatch' || github.event_name == 'workflow_call') }}
        run: |
          python3 scripts/build_full_integration_prism.py \
            "${{ runner.temp }}/packwiz-installer-bootstrap.jar" \
            "${{ runner.temp }}" "$(git rev-parse HEAD)" \
            "compat/progression/build/libs/tmm_progression-0.1.0-dev.jar" \
            "compat/transformations/build/libs/tmm_transformations-0.1.0-dev.jar"
      - name: Upload the one comprehensive unstable test build
        if: ${{ inputs.full_smoke == true && (github.event_name == 'workflow_dispatch' || github.event_name == 'workflow_call') }}
        uses: actions/upload-artifact@v4
        with:
          name: Too-Much-Magic-Full-Integration-Prism-UNSTABLE
          path: ${{ runner.temp }}/Too-Much-Magic-Full-Integration-Prism.zip
          if-no-files-found: error
          retention-days: 30
      - name: Always retain diagnostics and exact source provenance
        if: ${{ always() && inputs.full_smoke == true && (github.event_name == 'workflow_dispatch' || github.event_name == 'workflow_call') }}
        uses: actions/upload-artifact@v4
        with:
          name: Full-Integration-Test-Evidence
          path: |
            manifest/integration-sources.json
            manifest/integration-lock.json
            ${{ runner.temp }}/tmm-full-integration-smoke/server.log
            ${{ runner.temp }}/tmm-full-integration-smoke/logs/latest.log
            ${{ runner.temp }}/tmm-jawr-food-audit/
          retention-days: 30
          if-no-files-found: warn
