name: Progression owned damage ABI (static only)
on:
  pull_request:
    paths:
      - '.github/workflows/progression-owned-damage-abi.yml'
      - 'compat/progression/tools/owned_damage_abi.py'
      - 'compat/progression/src/main/java/**/OwnedMagicDamage.java'
      - 'compat/progression/src/main/java/**/AstralDiscidiaOwnerMixin.java'
      - 'compat/progression/src/main/java/**/MahouBoundaryDamageMixin.java'
permissions:
  contents: read
jobs:
  abi:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Inspect pinned damage signatures without game launch
        run: python3 compat/progression/tools/owned_damage_abi.py
