name: Monk addon build
on:
  push:
    paths:
      - 'compat/monk/**'
      - '.github/workflows/monk-framework.yml'
  pull_request:
    paths:
      - 'compat/monk/**'
      - '.github/workflows/monk-framework.yml'
permissions:
  contents: read
jobs:
  compile-and-unit-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: compat/monk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'
      - run: gradle --no-daemon build
      - name: Publish compiled Monk addon for disposable-pack testing
        uses: actions/upload-artifact@v4
        with:
          name: tmm-monk-addon-${{ github.sha }}
          path: compat/monk/build/libs/*.jar
          if-no-files-found: error
          retention-days: 14
