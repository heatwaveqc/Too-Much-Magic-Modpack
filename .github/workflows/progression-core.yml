name: Standalone progression core

on:
  push:
    paths:
      - 'compat/progression/**'
      - '.github/workflows/progression-core.yml'
  pull_request:
    paths:
      - 'compat/progression/**'
      - '.github/workflows/progression-core.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: compat/progression
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'
      - name: Compile and run core tests
        run: gradle --no-daemon build
      - name: Boot disposable dedicated NeoForge server with standalone progression JAR
        timeout-minutes: 5
        shell: bash
        run: |
          mkdir -p run
          printf 'eula=true\n' > run/eula.txt
          set +e
          timeout --signal=INT --kill-after=12s 120s gradle --no-daemon runServer --console=plain > progression-server.log 2>&1
          code=$?
          set -e
          tail -n 100 progression-server.log
          if ! grep -Fq 'For help, type' progression-server.log; then
            echo 'FAIL: standalone dedicated server did not reach ready state' >&2
            exit 1
          fi
          if ! grep -Fq 'Loaded 2 progression path definitions' progression-server.log; then
            echo 'FAIL: server loaded fewer than two progression paths' >&2
            exit 1
          fi
          if grep -Ei 'Exception in server tick loop|ModLoadingException|Failed to load mod|Error loading' progression-server.log; then
            echo 'FAIL: observed mod/server startup error' >&2
            exit 1
          fi
          echo "PASS: server reached ready state (Gradle runner exit code $code)"
      - name: Upload standalone server boot log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: progression-standalone-server-failure
          path: compat/progression/progression-server.log
          if-no-files-found: ignore
