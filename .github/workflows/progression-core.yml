name: Standalone progression core

on:
  push:
    paths:
      - 'compat/progression/**'
      - '.github/workflows/progression-core.yml'
  pull_request:
    paths:
      - 'compat/progression/**'
      - '.github/workflows/progression-core.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: compat/progression
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'
      - name: Compile and run core tests
        run: gradle --no-daemon build
