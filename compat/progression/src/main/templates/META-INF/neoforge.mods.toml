modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="Too Much Magic contributors"
description='''Datapack-configured, server-authoritative progression and player enhancement core.
Independent of Monk, Hunter, JAWR, Vampirism and Tyz.
'''

[[dependencies.${mod_id}]]
modId="neoforge"
type="required"
versionRange="[${neo_version},)"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="minecraft"
type="required"
versionRange="${minecraft_version_range}"
ordering="NONE"
side="BOTH"

# Client-only controls policy; leave unrelated experimental progression mixins unchanged.
[[mixins]]
config="tmm_controls_defaults.mixins.json"

# Gameplay loot predicate injection, separate from client controls policy.
[[mixins]]
config="tmm_progression.mixins.json"

# Engine-owned MXP hooks (guarded when legacy module is installed).
[[mixins]]
config="tmm_progression_mxp.mixins.json"
