modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="Tyr Mod Family contributors"
description='''Datapack-configured, server-authoritative progression and player enhancement core.
Independent of Monk, Hunter, JAWR, Vampirism and Tyz.
'''

[[dependencies.${mod_id}]]
modId="neoforge"
type="required"
versionRange="[${neo_version},)"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="minecraft"
type="required"
versionRange="${minecraft_version_range}"
ordering="NONE"
side="BOTH"

# Client-only controls policy; leave unrelated experimental progression mixins unchanged.
[[mixins]]
config="tyr_controls_defaults.mixins.json"

# Gameplay loot predicate injection, separate from client controls policy.
[[mixins]]
config="tyr_progression.mixins.json"

# Engine-owned MXP hooks (guarded when legacy module is installed).
[[mixins]]
config="tyr_progression_mxp.mixins.json"

# Client-only optional lightmap compatibility hook.
[[mixins]]
config="tyr_progression_vision.mixins.json"

# Optional Dragon Survival beverage permission hook.
[[mixins]]
config="tyr_progression_diet.mixins.json"

# Optional transformation, Dracolich rendering and magic compat; each mixin is version-gated.
[[mixins]]
config="tmm_transformations.mixins.json"
