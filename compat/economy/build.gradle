plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
}
version = mod_version
group = 'io.github.heatwaveqc.tmm'
base { archivesName = mod_id }
java.toolchain.languageVersion = JavaLanguageVersion.of(21)
neoForge {
    version = neo_version
    mods { "${mod_id}" { sourceSet(sourceSets.main) } }
}
repositories { mavenCentral() }
// Use the hash-verified installed mod directory supplied by the integration
// writer, never download a moving version or redistribute upstream jars.
def modsDir = providers.gradleProperty('tmmCompileModsDir')
def exactJars = ['ProjectE-1.21.1-PE1.1.0.jar', 'Apotheosis-1.21.1-8.9.0.jar', 'Placebo-1.21.1-9.9.4.jar', 'Botania-Revived-1.21.1-2.0.2-NeoForge.jar', 'evilcraft-1.21.1-neoforge-1.2.100.jar', 'ars_nouveau-1.21.1-5.13.5.jar', 'Draconic-Evolution-1.21.1-3.1.4.633.jar', 'BrandonsCore-1.21.1-3.2.1.309.jar', 'neovitae-1.21.1-1.1.53.jar', 'malum-1.21.1-1.8.2.jar', 'lodestone-1.21.1-1.8.2.jar', 'theurgy-1.21.1-neoforge-1.79.0.jar', 'forbidden_arcanus-2.6.1.jar', 'valhelsia_core-neoforge-1.21.1-1.1.4.jar', 'embers-reignited-1.21.1-1.5.9.jar', 'goety-3.2.2.jar', 'primalmagick-neoforge-1.21.1-6.0.7.jar', 'AstralSorcery-2.0.3.59.jar', 'Pastel-1.1.5.5.jar', 'irons_spellbooks-1.21.1-3.16.3.jar', 'irons_lib-1.21.1-2.3.0.jar', 'projectexpansion-1.21.1-1.0.6.jar', 'projecte-energy-0.1.4.jar']
if (modsDir.isPresent()) {
    exactJars.each { name ->
        if (!file("${modsDir.get()}/${name}").isFile()) throw new GradleException("Missing pinned compile dependency: ${name}")
    }
    dependencies { compileOnly fileTree(dir: modsDir.get(), include: ['*.jar']) }
}
tasks.named('compileJava') {
    doFirst { if (!modsDir.isPresent()) throw new GradleException('Supply -PtmmCompileModsDir=<hash-verified installed mods directory>') }
}
dependencies {
    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.4'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}
tasks.named('test', Test) { useJUnitPlatform() }
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
tasks.named('processResources') {
    inputs.property 'mod_version', mod_version
    filesMatching('META-INF/neoforge.mods.toml') { expand(mod_version: mod_version) }
}

tasks.named('jar', Jar) { from('LICENSE', 'ASSET-CREDITS.md', 'BOTANIA-ASSET-LICENSE.md') { into 'META-INF' } }
