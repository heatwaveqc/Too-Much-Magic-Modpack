modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="Too Much Magic contributors"
description='''Wandering trader spawn restrictions and a permanent, per-player trader-killer vendetta.
Villagers and wandering traders carry NPC-only pistols; confirmed villager-summoned golems carry miniguns. Llamas retain their vanilla spit.
'''

[[dependencies.${mod_id}]]
modId="neoforge"
type="required"
versionRange="[${neo_version},)"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="minecraft"
type="required"
versionRange="${minecraft_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="irons_spellbooks"
type="required"
versionRange="[1.21.1-3.16.3]"
ordering="AFTER"
side="BOTH"

[[mixins]]
config="traders_vengence.mixins.json"
