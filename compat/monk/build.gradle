plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
}
version = project.mod_version
group = project.mod_group_id
base { archivesName = project.mod_id }
java.toolchain.languageVersion = JavaLanguageVersion.of(21)
repositories {
    maven {
        name = 'Maxanier'
        url = 'https://maven.maxanier.de/releases'
        content { includeGroupAndSubgroups 'de.teamlapen' }
    }
}
neoForge {
    version = project.neo_version
    runs {
        client { client() }
        server { server(); programArgument '--nogui' }
    }
    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}
dependencies {
    // The 1.21-era (1.10.x) Vampirism artifact, NOT the 2.x FactionApi split.
    // This exact version matches mods/vampirism-become-a-vampire.pw.toml.
    implementation("de.teamlapen.vampirism:Vampirism:${vampirism_version}") {
        // Vampirism's old POM references optional integrations (JEI, Guide API,
        // TerraBlender) which are not required to compile the Monk addon.
        // The installed TMM pack resolves its own exact pinned runtime JARs.
        transitive = false
    }
    testImplementation 'com.google.code.gson:gson:2.11.0'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.4'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}
tasks.named('test', Test) { useJUnitPlatform() }
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
def generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    def properties = [
        mod_id: mod_id, mod_name: mod_name, mod_version: mod_version,
        mod_license: mod_license, neo_version: neo_version,
        minecraft_version_range: minecraft_version_range,
        loader_version_range: loader_version_range,
        vampirism_mod_version_range: vampirism_mod_version_range
    ]
    inputs.properties properties
    expand properties
    from 'src/main/templates'
    into 'build/generated/sources/modMetadata'
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata
