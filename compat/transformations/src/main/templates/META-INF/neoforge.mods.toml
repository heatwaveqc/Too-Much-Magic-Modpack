modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="Too Much Magic contributors"
description='''
Infrastructure for the Too Much Magic cross-mod transformation compatibility layer.
Experimental vampire chassis; all mutation/acquisition/cure controls default OFF.\nNot safe for existing survival worlds until gameplay integration acceptance gates pass.
'''

[[dependencies.${mod_id}]]
modId="neoforge"
type="required"
versionRange="[${neo_version},)"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="minecraft"
type="required"
versionRange="${minecraft_version_range}"
ordering="NONE"
side="BOTH"

[[mixins]]
config="tmm_transformations.mixins.json"
