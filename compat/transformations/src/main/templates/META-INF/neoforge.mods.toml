modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="Too Much Magic contributors"
description='''
Read-only JAWR-native vampire/lycanthrope and lich/dragon state diagnostics,
guarded Archlich/Dracolich death arbitration, and retaliation-aware mob alliances.
No TeamLapen Vampirism or Werewolves code; test only on disposable worlds.
'''

[[dependencies.${mod_id}]]
modId="neoforge"
type="required"
versionRange="[${neo_version},)"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="minecraft"
type="required"
versionRange="${minecraft_version_range}"
ordering="NONE"
side="BOTH"

[[mixins]]
config="tmm_transformations.mixins.json"
